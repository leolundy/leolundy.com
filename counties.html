const REGION_COLOURS={'England':'#d7aa31','Ireland':'#277765','Northern Ireland':'#376996','Scotland':'#7e5b9a','Wales':'#c56651','Islands':'#b5487b'};
const REGIONS=['All','England','Ireland','Northern Ireland','Scotland','Wales','Islands'];
const TOTALS={};const COMPLETED={};COUNTIES.forEach(c=>{TOTALS[c.region]=(TOTALS[c.region]||0)+1;if(c.completed)COMPLETED[c.region]=(COMPLETED[c.region]||0)+1});

function renderDiscs(){const list=COUNTIES.filter(c=>c.completed&&(active==='All'||c.region===active));document.getElementById('discs').innerHTML=list.map(c=>{const a=ASSIGNMENTS[c.name],n=c.races.length,r=n>=20?18:n>=5?15:12.5,halo=r+3.5;return `<g class="county-disc" data-id="${c.id}" aria-label="${esc(c.name)}: ${n} races"><title>${esc(c.name)} · ${n} ${n===1?'race':'races'}</title><circle class="disc-halo" cx="${a.cx}" cy="${a.cy}" r="${halo}"></circle><circle class="disc-core" cx="${a.cx}" cy="${a.cy}" r="${r}" fill="${REGION_COLOURS[c.region]}"></circle><text class="disc-count" x="${a.cx}" y="${a.cy+.5}">${n}</text></g>`}).join('');document.querySelectorAll('.county-disc').forEach(g=>g.onclick=e=>{e.stopPropagation();showCounty(COUNTIES.find(c=>c.id===+g.dataset.id))})}
function countyAtEvent(e){if(!hitPixels)return null;const rect=document.getElementById('hoverLayer').getBoundingClientRect(),x=Math.max(0,Math.min(684-1,Math.floor((e.clientX-rect.left)/rect.width*684))),y=Math.max(0,Math.min(871-1,Math.floor((e.clientY-rect.top)/rect.height*871))),id=hitPixels[(y*684+x)*4];return COUNTIES.find(c=>c.id===id)||null}
function clearZero(){if(!hoverId)return;hoverId=0;document.getElementById('hoverLayer').getContext('2d').clearRect(0,0,684,871);document.getElementById('zeroLabel').classList.remove('show')}
function showZero(c){if(!c||c.completed||(active!=='All'&&c.region!==active)){clearZero();return}if(hoverId===c.id)return;hoverId=c.id;const canvas=document.getElementById('hoverLayer'),ctx=canvas.getContext('2d'),out=ctx.createImageData(684,871),id=c.id,w=684,h=871;for(let y=1;y<h-1;y++){for(let x=1;x<w-1;x++){let p=(y*w+x)*4;if(hitPixels[p]!==id)continue;let edge=hitPixels[p-4]!==id||hitPixels[p+4]!==id||hitPixels[p-w*4]!==id||hitPixels[p+w*4]!==id;out.data[p]=83;out.data[p+1]=96;out.data[p+2]=89;out.data[p+3]=edge?120:27}}ctx.clearRect(0,0,w,h);ctx.putImageData(out,0,0);const a=ASSIGNMENTS[c.name],label=document.getElementById('zeroLabel');label.innerHTML=`${esc(c.name)} <span>· 0 events</span>`;label.style.left=`${a.cx/w*100}%`;label.style.top=`${a.cy/h*100}%`;label.classList.add('show')}
function initHitMap(){const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=684;c.height=871;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);hitPixels=x.getImageData(0,0,c.width,c.height).data};img.src=MAPS.Hit;const layer=document.getElementById('hoverLayer');layer.onpointermove=e=>showZero(countyAtEvent(e));layer.onpointerleave=clearZero;layer.onclick=e=>{const c=countyAtEvent(e);if(!c)return clearZero();if(c.completed)showCounty(c);else showZero(c)}}
function initIslandMaps(){const islands=[...document.querySelectorAll('.island-link')];islands.forEach(b=>{b.onpointerenter=()=>b.classList.add('active');b.onpointerleave=()=>{if(document.activeElement!==b)b.classList.remove('active')};b.onclick=()=>{islands.forEach(x=>x.classList.remove('active'));b.classList.add('active')}})}
function positionPopup(c){if(window.innerWidth<=760)return;requestAnimationFrame(()=>{const a=ASSIGNMENTS[c.name],shell=document.getElementById('mapShell').getBoundingClientRect(),stage=document.getElementById('mapStage').getBoundingClientRect(),popup=document.getElementById('popup'),pw=popup.offsetWidth,ph=popup.offsetHeight;let x=shell.left-stage.left+(a.cx/684)*shell.width,y=shell.top-stage.top+(a.cy/871)*shell.height;x=Math.max(pw/2+14,Math.min(stage.width-pw/2-14,x));y=Math.max(ph/2+14,Math.min(stage.height-ph/2-14,y));popup.style.left=`${x-pw/2}px`;popup.style.top=`${y-ph/2}px`})}
function showCounty(c){selected=c;document.querySelectorAll('.county-disc').forEach(g=>g.classList.toggle('active',+g.dataset.id===c.id));let a=ASSIGNMENTS[c.name],ring=document.getElementById('focusRing');ring.style.left=`${a.cx/684*100}%`;ring.style.top=`${a.cy/871*100}%`;ring.classList.add('show');let first=c.races[0];document.getElementById('popupContent').innerHTML=`<div class="region">${esc(c.region)} · County ${c.id} of 138</div><h3>${esc(c.name)}</h3><p class="lede">${c.races.length} qualifying ${c.races.length===1?'finish':'finishes'} in Marathon World.</p><div class="metrics"><div class="metric"><b>${c.races.length}</b><span>Official events</span></div><div class="metric"><b>${first.date.slice(0,4)}</b><span>First visited</span></div></div><div class="races">${[...c.races].reverse().map(r=>{let t=raceType(r);return `<div class="race"><span class="type ${t.toLowerCase()}">${t}</span><b>${esc(r.venue)}</b><small>${fmt(r.date)} · ${esc(r.time||'No time')}</small></div>`}).join('')}</div>`;document.getElementById('popup').classList.add('show');positionPopup(c)}

<script>
(function(){
  function reportHeight(){
    if(window.parent===window) return;
    const page=document.querySelector('.page');
    if(!page) return;
    const h=Math.ceil(page.getBoundingClientRect().bottom);
    window.parent.postMessage({type:'frameHeight',frame:'counties',height:h},'*');
  }
  window.addEventListener('load',()=>{reportHeight();setTimeout(reportHeight,200);setTimeout(reportHeight,800)});
  window.addEventListener('resize',()=>requestAnimationFrame(reportHeight));
  if('ResizeObserver' in window)new ResizeObserver(()=>requestAnimationFrame(reportHeight)).observe(document.body);
})();
